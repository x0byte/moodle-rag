<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Moodle Finder</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>Moodle Finder</h1>
    <p>Find your shit.</p>
  </header>

  <main>

    <button id="scanButton">
      Scan current page
    </button>

    <div id="status"></div>

    <section id="results" hidden>

      <h2 id="courseTitle"></h2>

      <div class="stat">
        <span>Headings</span>
        <strong id="headingCount">0</strong>
      </div>

      <div class="stat">
        <span>Resources</span>
        <strong id="resourceCount">0</strong>
      </div>

      <div class="stat">
        <span>Files</span>
        <strong id="fileCount">0</strong>
      </div>

      <h3>Resources found</h3>

      <div id="resourceList"></div>

    </section>

  </main>

  <script src="sidepanel.js"></script>

</body>
</html>

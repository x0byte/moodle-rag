[project]
name = "moodle-rag"
version = "0.1.0"
description = "Local RAG over Moodle course material, exposed through an MCP server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.3",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "sentence-transformers>=3",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]

[project.scripts]
moodle-ingest = "moodle_rag.server:main"
moodle-rag = "moodle_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_rag"]
